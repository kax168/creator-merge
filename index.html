const yt = (window.ytgame && window.ytgame.IN_PLAYABLES_ENV) ? window.ytgame : null;
const sdk = {
  firstFrame(){ try{ yt && yt.game.firstFrameReady(); }catch(e){} },
  ready(){ try{ yt && yt.game.gameReady(); }catch(e){} },
  _sent: 0,
  score(v){                                   // only report improvements, never spam
    if (v <= this._sent) return;
    this._sent = v;
    try{ yt && Promise.resolve(yt.engagement.sendScore({ value: v })).catch(() => {}); }catch(e){}
  },
  async load(){
    try{ if (yt) return await yt.game.loadData(); }catch(e){}
    try{ return localStorage.getItem('cm_save') || ''; }catch(e){ return ''; }
  },
  _last: '',
  save(s){
    if (s === this._last) return;
    this._last = s;
    try{ if (yt) { Promise.resolve(yt.game.saveData(s)).catch(() => {}); return; } }catch(e){}
    try{ localStorage.setItem('cm_save', s); }catch(e){}
  },
};

// Config
// =====================================================================

const JAR = { l: 14, r: 386, top: 172, bottom: 664 };   // play area
const TOP_LINE = JAR.top + 6, DROP_Y = JAR.top - 34;
const GRAV = 1700, AIR = 0.998, REST = 0.12, FRICTION = 0.08, SUBSTEPS = 6;
const TILT_STRENGTH = 0.5, TILT_MAX_DEG = 35;
const DROP_COOLDOWN = 380;
// difficulty ramps with score: more variety in the drop queue = harder to keep merging

  { r: 17,  c: '#ff5a52', d: '#c9241c', n: 'Like' },
  { r: 23,  c: '#ff9147', d: '#d35d12', n: 'Bell' },

  { r: 45,  c: '#36ccc6', d: '#138b86', n: 'Gamer' },

  { r: 73,  c: '#ff6aab', d: '#d02f74', n: 'Star' },
  { r: 84,  c: '#e2e7ec', d: '#8f98a3', n: 'Trophy' },
  { r: 96,  c: '#ffdc6a', d: '#c79a12', n: 'Crown' },
  { r: 108, c: '#a8ecff', d: '#3fa8d6', n: 'Diamond' },

let settings = { v: 2, music: true, sound: true, haptic: true, tilt: false, shake: true };
let showSettings = false;
let daily = false, dailyKey = '', dailyBest = {}, rng = Math.random;
let saveTimer = 0, dirty = false;
let ytAudio = true;
let tiltG = 0, tiltTarget = 0, tiltAvailable = false;
let bokeh = [];
let time = 0, simClock = 0;   // simClock only advances while the simulation runs

function todayKey(){ const d = new Date(); return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate(); }
function rndTier(){
  let w = SPAWN_STAGES[0].w;
  for (const s of SPAWN_STAGES) if (score >= s.at) w = s.w;
  let x = rng();
  for (let i = 0; i < w.length; i++){ x -= w[i]; if (x < 0) return i; }
  return 0;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = p => 1 + 2.7 * Math.pow(p - 1, 3) + 1.7 * Math.pow(p - 1, 2);
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);

function resize(){
  const s = Math.max(0.01, Math.min(innerWidth / W, innerHeight / H));   // YouTube WebView starts hidden at 0x0
  viewScale = s;
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px';
  cv.style.marginTop = Math.max(0, (innerHeight - H*s) / 2) + 'px';
  cv.width = Math.round(W*s*dpr); cv.height = Math.round(H*s*dpr);
  ctx.setTransform(s*dpr, 0, 0, s*dpr, 0, 0);
}
addEventListener('resize', resize);

for (let i = 0; i < 18; i++) bokeh.push({ x: Math.random()*W, y: Math.random()*H, r: 20 + Math.random()*70, s: 4 + Math.random()*10, h: Math.floor(Math.random()*TIERS.length), p: Math.random()*6 });

// =====================================================================
// Audio (synthesized)
// =====================================================================
let ac = null, master = null;
function audio(){
  if (!ac){
    try{
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    }catch(e){ return null; }
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
const soundOn = () => settings.sound && ytAudio;
function tone(f, dur, { type = 'sine', vol = 0.3, to = null, delay = 0 } = {}){
  if (!soundOn() || !audio()) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, { vol = 0.2, freq = 800, delay = 0 } = {}){
  if (!soundOn() || !audio()) return;
  const t = ac.currentTime + delay, len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f).connect(g).connect(master); src.start(t);
}
const sfx = {
  click(){ tone(900, 0.05, { type: 'square', vol: 0.06 }); },
  drop(){ tone(700, 0.08, { to: 320, vol: 0.16 }); noise(0.05, { vol: 0.05, freq: 3000 }); },
  land(v){ const k = Math.min(1, v / 1500); tone(150, 0.09, { type: 'triangle', to: 60, vol: 0.08 + 0.17*k }); noise(0.06, { vol: 0.06*k, freq: 600 }); },
  merge(t, c){
    const n = NOTES[t] * (1 + Math.min(c, 4) * 0.059);
    tone(n, 0.16, { type: 'triangle', vol: 0.26 });
    tone(n * 1.5, 0.22, { vol: 0.14, delay: 0.04 });
    noise(0.08, { vol: 0.08, freq: 2500 });
    if (t >= 4) tone(n / 2, 0.3, { type: 'sine', vol: 0.18 });
    if (t >= 7){ [1, 1.25, 1.5, 2].forEach((m, i) => tone(n * m, 0.5, { vol: 0.12, delay: 0.06 + i*0.06 })); noise(0.4, { vol: 0.12, freq: 1200 }); }
  },
  fanfare(){ [523, 659, 784, 1047].forEach((f, i) => { tone(f, 0.3, { type: 'triangle', vol: 0.18, delay: i*0.09 }); }); tone(1047, 0.8, { vol: 0.12, delay: 0.36 }); },
  warn(){ tone(880, 0.08, { type: 'square', vol: 0.05 }); },
  over(){ [440, 370, 311, 262].forEach((f, i) => tone(f, 0.3, { type: 'triangle', vol: 0.22, delay: i*0.15 })); },
};
// Android: Vibration API. iOS (Safari 18+): toggling a native <input switch> fires the system haptic.
const iosHaptic = (() => {
  if (navigator.vibrate) return null;
  const label = document.createElement('label'), input = document.createElement('input');
  input.type = 'checkbox'; input.setAttribute('switch', '');
  label.appendChild(input); label.style.cssText = 'position:fixed;left:-999px;top:0;opacity:0;pointer-events:none';
  document.body.appendChild(label);
  return label;
})();
// ---------- Background music: a light 4-chord loop, scheduled ahead on the audio clock ----------
const music = {
  bpm: 104, step: 0, nextT: 0, gain: null, timer: null,
  chords: [[262, 330, 392], [220, 262, 330], [175, 220, 262], [196, 247, 294]],   // C Am F G
  wanted(){ return settings.music && ytAudio && !paused; },
  start(){
    if (this.timer || !audio()) return;
    if (!this.gain){ this.gain = ac.createGain(); this.gain.connect(master); }
    this.gain.gain.cancelScheduledValues(ac.currentTime);
    this.gain.gain.setTargetAtTime(0.32, ac.currentTime, 0.3);
    this.nextT = ac.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 80);
  },
  stop(){
    if (!this.timer) return;
    clearInterval(this.timer); this.timer = null;
    if (this.gain) this.gain.gain.setTargetAtTime(0, ac.currentTime, 0.15);
  },
  sync(){ this.wanted() ? this.start() : this.stop(); },
  note(f, t, dur, type, vol){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.gain); o.start(t); o.stop(t + dur + 0.05);
  },
  tick(){
    const sixteenth = 60 / this.bpm / 4;
    while (this.nextT < ac.currentTime + 0.25){
      const s = this.step % 64, chord = this.chords[Math.floor(s / 16)], t = this.nextT;
      if (s % 16 === 0) chord.forEach(f => this.note(f, t, sixteenth * 15, 'sine', 0.05));          // pad
      if (s % 4 === 0) this.note(chord[0] / 2, t, sixteenth * 3, 'triangle', 0.12);                  // bass
      if (s % 2 === 0){ const arp = [0, 1, 2, 1, 2, 0, 1, 2][(s / 2) % 8]; this.note(chord[arp] * 2, t, sixteenth * 1.6, 'triangle', 0.045); }
      this.step++; this.nextT += sixteenth;
    }
  },
};

function buzz(ms){
  if (!settings.haptic) return;
  try{
    if (navigator.vibrate) navigator.vibrate(ms);
    else if (iosHaptic){
      const n = Array.isArray(ms) ? Math.ceil(ms.length / 2) : 1;
      for (let i = 0; i < n; i++) setTimeout(() => iosHaptic.click(), i * 90);
    }
  }catch(e){}
}

// =====================================================================
// Tilt (device gravity)
// =====================================================================
let tiltListening = false;
async function enableTilt(){
  if (tiltListening || !window.DeviceOrientationEvent) return;
  try{
    if (typeof DeviceOrientationEvent.requestPermission === 'function'){
      const p = await DeviceOrientationEvent.requestPermission();   // iOS: must be inside a tap
      if (p !== 'granted') return;
    }
  }catch(e){ return; }
  tiltListening = true;
  addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    tiltAvailable = true;
    const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    let deg = ang === 90 ? e.beta : (ang === -90 || ang === 270) ? -e.beta : ang === 180 ? -e.gamma : e.gamma;
    deg = clamp(deg, -TILT_MAX_DEG, TILT_MAX_DEG);
    if (Math.abs(deg) < 3) deg = 0;                                     // small dead zone
    tiltTarget = Math.sin(deg * Math.PI / 180) * GRAV * TILT_STRENGTH;
  });
}

// =====================================================================
// Icons (vector, 100x100 box centered on 0,0)
// =====================================================================
function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function starPath(cx, cy, R, r, n = 5){
  ctx.beginPath();
  for (let i = 0; i < n*2; i++){
    const a = -Math.PI/2 + i * Math.PI/n, rad = i % 2 ? r : R;
    ctx.lineTo(cx + Math.cos(a)*rad, cy + Math.sin(a)*rad);
  }
  ctx.closePath();
}
const ICONS = [
  c => { rr(-30, -6, 13, 34, 3); ctx.fill(); ctx.beginPath();
    ctx.moveTo(-12, -6); ctx.lineTo(-2, -30); ctx.quadraticCurveTo(10, -32, 8, -18);
    ctx.lineTo(5, -8); ctx.lineTo(24, -8); ctx.quadraticCurveTo(32, -7, 30, 2);
    ctx.lineTo(24, 24); ctx.quadraticCurveTo(22, 28, 16, 28); ctx.lineTo(-12, 28); ctx.closePath(); ctx.fill(); },
  c => { ctx.beginPath(); ctx.moveTo(-26, 16); ctx.quadraticCurveTo(-18, 8, -18, -6);
    ctx.quadraticCurveTo(-18, -28, 0, -28); ctx.quadraticCurveTo(18, -28, 18, -6);
    ctx.quadraticCurveTo(18, 8, 26, 16); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 23, 7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -30, 5, 0, Math.PI*2); ctx.fill(); },
  c => { rr(-30, -26, 60, 40, 14); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-14, 10); ctx.lineTo(-20, 30); ctx.lineTo(4, 12); ctx.fill();
    ctx.fillStyle = c; [-14, 0, 14].forEach(x => { ctx.beginPath(); ctx.arc(x, -6, 5, 0, Math.PI*2); ctx.fill(); }); },
  c => { ctx.beginPath(); ctx.ellipse(-14, 20, 11, 8, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18, 12, 11, 8, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(-6, -22, 6, 42); ctx.fillRect(26, -30, 6, 42);
    ctx.beginPath(); ctx.moveTo(-6, -22); ctx.lineTo(32, -30); ctx.lineTo(32, -18); ctx.lineTo(-6, -10); ctx.fill(); },
  c => { rr(-36, -16, 72, 34, 16); ctx.fill();
    ctx.beginPath(); ctx.arc(-24, 12, 14, 0, Math.PI*2); ctx.arc(24, 12, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c; ctx.fillRect(-26, -4, 18, 6); ctx.fillRect(-20, -10, 6, 18);
    ctx.beginPath(); ctx.arc(16, -4, 4, 0, Math.PI*2); ctx.arc(26, 4, 4, 0, Math.PI*2); ctx.fill(); },
  c => { rr(-30, -6, 60, 36, 4); ctx.fill();
    ctx.save(); ctx.rotate(-0.22); rr(-32, -26, 60, 14, 3); ctx.fill();
    ctx.fillStyle = c; for (let x = -26; x < 24; x += 14){ ctx.beginPath(); ctx.moveTo(x, -26); ctx.lineTo(x + 7, -26); ctx.lineTo(x + 2, -12); ctx.lineTo(x - 5, -12); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = c; for (let x = -24; x < 26; x += 14){ ctx.beginPath(); ctx.moveTo(x, -6); ctx.lineTo(x + 7, -6); ctx.lineTo(x + 2, 4); ctx.lineTo(x - 5, 4); ctx.fill(); } },
  c => { rr(-34, -18, 46, 36, 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(14, -4); ctx.lineTo(34, -18); ctx.lineTo(34, 18); ctx.lineTo(14, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(-24, -8, 4, 0, Math.PI*2); ctx.fill(); },
  c => { starPath(0, 3, 34, 15); ctx.fill(); ctx.fillStyle = c; starPath(0, 3, 14, 6); ctx.fill(); },
  // 8 trophy cup
  c => {
    ctx.beginPath(); ctx.moveTo(-22, -28); ctx.lineTo(22, -28); ctx.lineTo(20, -6);
    ctx.quadraticCurveTo(16, 10, 0, 12); ctx.quadraticCurveTo(-16, 10, -20, -6); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.arc(-22, -14, 10, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(22, -14, 10, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
    ctx.fillRect(-5, 10, 10, 12); rr(-18, 20, 36, 10, 3); ctx.fill();
    ctx.fillStyle = c; starPath(0, -12, 10, 4); ctx.fill();
  },
  // 9 crown
  c => {
    ctx.beginPath(); ctx.moveTo(-32, 18); ctx.lineTo(-34, -16); ctx.lineTo(-16, 0); ctx.lineTo(0, -26);
    ctx.lineTo(16, 0); ctx.lineTo(34, -16); ctx.lineTo(32, 18); ctx.closePath(); ctx.fill();
    rr(-32, 20, 64, 9, 3); ctx.fill();
    [[-34, -18], [0, -28], [34, -18]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill(); });
    ctx.fillStyle = c; [-16, 0, 16].forEach(x => { ctx.beginPath(); ctx.arc(x, 9, 4, 0, Math.PI*2); ctx.fill(); });
  },
  c => { ctx.beginPath(); ctx.moveTo(-32, -10); ctx.lineTo(-18, -28); ctx.lineTo(18, -28); ctx.lineTo(32, -10); ctx.lineTo(0, 32); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-32, -10); ctx.lineTo(32, -10);
    ctx.moveTo(-18, -28); ctx.lineTo(-8, -10); ctx.lineTo(0, 32); ctx.lineTo(8, -10); ctx.lineTo(18, -28);
    ctx.moveTo(-8, -10); ctx.lineTo(0, -28); ctx.lineTo(8, -10); ctx.stroke(); },
];

function drawBall(x, y, t, { alpha = 1, s = 1, a = 0, sq = 0, flash = 0, shadow = true } = {}){
  const { r, c, d } = TIERS[t];
  const R = r * s;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
  ctx.scale(1 + sq, 1 - sq);                           // squash & stretch
  if (shadow){
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.arc(0, R*0.12, R, 0, Math.PI*2); ctx.fill();
  }
  const g = ctx.createRadialGradient(-R*0.35, -R*0.45, R*0.1, 0, 0, R);
  g.addColorStop(0, c); g.addColorStop(1, d);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2); ctx.fill();
  ctx.lineWidth = Math.max(1.5, R*0.06); ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.stroke();
  ctx.save(); ctx.rotate(a); ctx.scale(R / 50, R / 50);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
  ICONS[t](d);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.beginPath(); ctx.ellipse(-R*0.34, -R*0.46, R*0.36, R*0.17, -0.55, 0, Math.PI*2); ctx.fill();
  if (flash > 0){
    ctx.globalAlpha = alpha * flash;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// =====================================================================
// Save
// =====================================================================
function flushSave(){
  dirty = false; saveTimer = 0;
  sdk.save(JSON.stringify({
    best, bestTier, settings, dailyBest,
    run: mode === 'play' ? { score, cur, next, runTier, daily, dailyKey, seedState, balls: balls.map(b => [Math.round(b.x), Math.round(b.y), b.t]) } : null,
  }));
}
// mark state as changed; cloud save is throttled to SAVE_INTERVAL unless `now`
function persist(now = false){ dirty = true; if (now) flushSave(); }

let seedState = 0;
function seeded(){
  seedState = seedState + 0x6D2B79F5 | 0;
  let t = Math.imul(seedState ^ seedState >>> 15, 1 | seedState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function goHome(){ mode = 'title'; balls = []; particles = []; texts = []; rings = []; banners = []; overTimer = 0; persist(true); }
function startGame(isDaily = false){
  daily = isDaily;
  if (daily){ dailyKey = todayKey(); seedState = dailyKey; rng = seeded; } else rng = Math.random;
  balls = []; score = 0; shownScore = 0; overTimer = 0; combo = 0; runTier = 0;
  bestAtStart = daily ? (dailyBest[dailyKey] || 0) : best; newBestShown = false;
  cur = rndTier(); next = rndTier(); canDrop = true; mode = 'play'; showSettings = false;
  particles = []; texts = []; banners = []; rings = [];
  persist(true);
}

// =====================================================================
// UI: hit regions are registered while drawing, so layout lives in one place
// =====================================================================
const isTouch = matchMedia('(pointer: coarse)').matches;
let uiHits = [];
function ui(x, y, w, h, fn){ uiHits.push({ x, y, w, h, fn }); }
// regions are rebuilt every frame (new closures), so identify a button by its rectangle, not its handler
const sameUI = (a, b) => !!a && !!b && a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h;
function hitUI(p){ for (let i = uiHits.length - 1; i >= 0; i--){ const u = uiHits[i]; if (p.x >= u.x && p.x <= u.x + u.w && p.y >= u.y && p.y <= u.y + u.h) return u; } return null; }

function drawGear(x, y){
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 8; i++){ ctx.save(); ctx.rotate(i * Math.PI / 4); ctx.fillRect(-2.5, -10, 5, 5); ctx.restore(); }
  ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2a2440'; ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ui(x - 24, y - 24, 48, 48, () => { showSettings = true; music.sync(); });
}

function pillButton(cx, cy, w, h, label, color, fn, sub){
  const pressed = sameUI(downUI, { x: cx - w/2, y: cy - h/2, w, h });
  ctx.save(); ctx.translate(cx, cy); if (pressed) ctx.scale(0.95, 0.95);
  ctx.fillStyle = color; rr(-w/2, -h/2, w, h, h/2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; rr(-w/2 + 4, -h/2 + 3, w - 8, h/2 - 3, h/4); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 18px system-ui,sans-serif'; ctx.fillText(label, 0, sub ? -6 : 1);
  if (sub){ ctx.font = '700 11px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillText(sub, 0, 12); }
  ctx.restore();
  ui(cx - w/2, cy - h/2, w, h, fn);
}

const SETTING_ROWS = [['music', 'Music'], ['sound', 'Sound effects'], ['haptic', 'Vibration'], ['shake', 'Screen shake'], ['tilt', 'Tilt to roll']]
  .filter(([k]) => k !== 'tilt' || isTouch);
function toggleSetting(k){
  settings[k] = !settings[k];
  if (k === 'tilt' && settings.tilt) enableTilt();
  if (k === 'haptic' && settings.haptic) buzz(20);
  if (k === 'music') music.sync();
  sfx.click(); persist(true);
}
function drawSettings(){
  ctx.fillStyle = 'rgba(5,5,12,0.7)'; ctx.fillRect(0, 0, W, H);
  ui(0, 0, W, H, () => {});                                  // swallow taps behind the panel
  const rows = SETTING_ROWS.length, ph = 120 + rows * 54 + (mode === 'play' ? 70 : 10), py = (H - ph) / 2;
  ctx.fillStyle = 'rgba(30,26,50,0.97)'; rr(40, py, W - 80, ph, 26); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '900 22px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(mode === 'play' ? 'PAUSED' : 'SETTINGS', W/2, py + 36);
  SETTING_ROWS.forEach(([k, label], i) => {
    const y = py + 86 + i * 54, on = settings[k];

    ctx.fillText(label, 68, y);
    ctx.fillStyle = on ? '#4cd964' : 'rgba(255,255,255,0.18)'; rr(282, y - 14, 50, 28, 14); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(on ? 318 : 296, y, 11, 0, Math.PI*2); ctx.fill();
    ui(56, y - 24, W - 112, 48, () => toggleSetting(k));
  });
  const by = py + 86 + rows * 54 + 8;
  if (mode === 'play'){
    pillButton(W/2 - 66, by, 120, 48, 'RESUME', '#ff5a52', () => { showSettings = false; sfx.click(); music.sync(); });
    pillButton(W/2 + 66, by, 120, 48, 'HOME', 'rgba(255,255,255,0.16)', () => { showSettings = false; goHome(); sfx.click(); });
  } else {
    pillButton(W/2, by, 160, 48, 'CLOSE', '#ff5a52', () => { showSettings = false; sfx.click(); });
  }
}

// =====================================================================
// Input
// =====================================================================
function toLocal(ev){ const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / viewScale, y: (ev.clientY - r.top) / viewScale }; }
let downUI = null;
cv.addEventListener('pointermove', e => { if (!downUI) aimX = toLocal(e).x; });
cv.addEventListener('pointerdown', e => {
  audio(); music.sync();
  const p = toLocal(e);
  downUI = hitUI(p);
  if (!downUI) aimX = p.x;
});
cv.addEventListener('pointerup', e => {
  const p = toLocal(e);
  if (downUI){ const u = hitUI(p); if (sameUI(u, downUI)) u.fn(); downUI = null; return; }
  if (settings.tilt) enableTilt();
  if (mode === 'play' && !showSettings){ aimX = p.x; drop(); }
});

function makeBall(x, y, t, vy = 0){
  return { x, y, vx: 0, vy, t, a: 0, w: 0, born: simClock, pop: 1, sq: 0, sqv: 0, flash: 0, landed: false };
}
function aimPos(){ const r = TIERS[cur].r; return clamp(aimX, JAR.l + r, JAR.r - r); }
function drop(){
  if (!canDrop || paused || mode !== 'play') return;
  const b = makeBall(aimPos(), DROP_Y, cur, 220);
  b.sq = -0.15;                                          // stretch while falling
  balls.push(b);
  cur = next; next = rndTier(); nextPop = 0; canDrop = false;
  sfx.drop(); buzz(8);
  setTimeout(() => canDrop = true, DROP_COOLDOWN);
}

// =====================================================================
// Physics
// =====================================================================
function impact(b, v){
  if (!b.landed){
    b.landed = true;
    if (v > 250){ sfx.land(v); b.sq += Math.min(0.28, v / 2600); if (v > 900) addTrauma(0.06); }
  }
}
function step(dt){
  simClock += dt;
  const gx = settings.tilt ? tiltG : 0;
  for (const b of balls){
    b.vx += gx * dt; b.vy += GRAV * dt;
    b.vx *= AIR; b.vy *= AIR;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.a += b.w * dt; b.w *= 0.995;
    const r = TIERS[b.t].r;
    if (b.x < JAR.l + r){ b.x = JAR.l + r; if (b.vx < -300) b.sq -= 0.1; b.vx = -b.vx * REST; }
    if (b.x > JAR.r - r){ b.x = JAR.r - r; if (b.vx > 300) b.sq -= 0.1; b.vx = -b.vx * REST; }
    if (b.y > JAR.bottom - r){
      impact(b, b.vy);
      b.y = JAR.bottom - r; b.vy = -b.vy * REST; b.vx *= 0.985;
      b.w = b.vx / r;
    }
  }
  const merges = [];
  for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++){
    const a = balls[i], b = balls[j];
    if (a.dead || b.dead) continue;
    const ra = TIERS[a.t].r, rb = TIERS[b.t].r;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, ov = ra + rb - d;
    if (ov <= 0) continue;
    if (a.t === b.t){ a.dead = b.dead = true; merges.push([a, b]); continue; }   // two diamonds = blast
    const nx = dx / d, ny = dy / d;
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy, rv = rvx * nx + rvy * ny;
    impact(a, -rv); impact(b, -rv);
    const ma = ra*ra, mb = rb*rb, tot = ma + mb, corr = ov * 0.8;
    a.x -= nx * corr * mb / tot; a.y -= ny * corr * mb / tot;
    b.x += nx * corr * ma / tot; b.y += ny * corr * ma / tot;
    if (rv < 0){
      const imp = -(1 + REST) * rv / (1/ma + 1/mb);
      a.vx -= imp * nx / ma; a.vy -= imp * ny / ma;
      b.vx += imp * nx / mb; b.vy += imp * ny / mb;
      const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty;
      const fi = vt * FRICTION / (1/ma + 1/mb);
      a.vx += fi * tx / ma; a.vy += fi * ty / ma;
      b.vx -= fi * tx / mb; b.vy -= fi * ty / mb;
      a.w += vt * 0.02 / ra; b.w -= vt * 0.02 / rb;
    }
  }
  for (const [a, b] of merges) doMerge(a, b);
  if (merges.length){
    balls = balls.filter(b => !b.dead);
    persist();
  }
}

function doMerge(a, b){
  const top = TIERS.length - 1, blast = a.t === top;
  const t = blast ? top : a.t + 1, x = (a.x + b.x)/2, y = (a.y + b.y)/2;
  if (!blast){
    const nb = makeBall(x, y, t, -140);
    nb.landed = true; nb.pop = 0; nb.flash = 1;
    balls.push(nb);
  }
  // nudge neighbours outward (knockback) so merges feel physical
  for (const o of balls){
    if (o.dead || (!blast && o === balls[balls.length - 1])) continue;
    const dx = o.x - x, dy = o.y - y, d = Math.hypot(dx, dy) || 1, reach = TIERS[t].r + TIERS[o.t].r + (blast ? 120 : 20);
    if (d < reach){ const k = (1 - d / reach) * (blast ? 900 : 120 + t * 25); o.vx += dx / d * k; o.vy += dy / d * k * 0.6; }
  }
  combo = comboTimer > 0 ? combo + 1 : 0; comboTimer = 0.9;
  const mult = 1 + Math.min(combo, 4);
  const pts = (blast ? DIAMOND_BONUS : (t + 1) * (t + 2) / 2 * 10) * mult;
  score += pts; scorePop = 1;
  const fx = fxTier(t), col = TIERS[t].c;
  addTrauma(blast ? 1 : fx.trauma);
  hitStop = Math.max(hitStop, blast ? 0.2 : fx.stop);
  burst(x, y, col, blast ? 90 : fx.parts, blast ? 600 : 120 + t * 28, t >= 7);
  if (blast) burst(x, y, '#fff', 40, 500, true);
  rings.push({ x, y, r: TIERS[t].r * 0.5, max: TIERS[t].r * (blast ? 4 : 2), life: 1, c: col, w: blast ? 12 : 6 });
  if (t >= 4) rings.push({ x, y, r: TIERS[t].r * 0.3, max: TIERS[t].r * (blast ? 5 : 2.8), life: 1, c: '#fff', w: 3 });
  texts.push({ x, y: y - TIERS[t].r * 0.4, vx: (Math.random() - 0.5) * 40, s: '+' + pts.toLocaleString(), sub: mult > 1 ? 'x' + mult : '', life: 1, c: col, big: t >= 7 });
  if (t >= 7){ zoomV += blast ? 1.6 : 0.9; }
  buzz(blast ? [40, 40, 60, 40, 120] : t >= 7 ? [30, 40, 60] : t >= 4 ? 25 : 12);
  sfx.merge(t, combo);
  if (blast){ banners.push({ title: 'DIAMOND BLAST!', name: '+' + (DIAMOND_BONUS * mult).toLocaleString(), t: top, life: 2.4 }); setTimeout(() => sfx.fanfare(), 120); }
  if (t > runTier) runTier = t;
  if (t > bestTier){
    bestTier = t;
    if (t >= 3){ banners.push({ title: 'NEW!', name: TIERS[t].n, t, life: 2.2 }); setTimeout(() => sfx.fanfare(), 150); }
  }
  if (!newBestShown && bestAtStart > 0 && score > bestAtStart){
    newBestShown = true; banners.push({ title: 'NEW BEST!', name: '', t: -1, life: 1.8 }); sfx.fanfare();
  }
  recordBest();
}
function recordBest(){
  if (daily){ dailyBest[dailyKey] = Math.max(dailyBest[dailyKey] || 0, score); }
  else { best = Math.max(best, score); sdk.score(best); }
}

function addTrauma(v){ trauma = Math.min(1, trauma + v); }

function checkOver(dt){
  // any settled ball (not freshly dropped) poking above the line counts; jitter in a packed pile must not reset it
  const above = balls.some(b => simClock - b.born > 1.5 && b.y - TIERS[b.t].r < TOP_LINE);
  const prev = overTimer;
  overTimer = above ? overTimer + dt : Math.max(0, overTimer - dt);
  if (above && Math.floor(prev * 4) !== Math.floor(overTimer * 4)) sfx.warn();
  if (overTimer > 2){
    mode = 'over'; overT = 0;
    recordBest();
    persist(true); sfx.over(); buzz([60, 80, 120]); addTrauma(0.5);
  }
}

function burst(x, y, c, n, sp, confetti){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = sp * (0.35 + Math.random());
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 80, life: 0.5 + Math.random()*0.4, max: 0.9, c: Math.random() < 0.25 ? '#fff' : c, sz: 2.5 + Math.random()*4, kind: Math.random() < 0.3 ? 'star' : 'dot', rot: Math.random()*6, vr: (Math.random()-0.5)*12 });
  }
  if (confetti) for (let i = 0; i < 40; i++){
    const a = -Math.PI/2 + (Math.random()-0.5) * 2.2, s = 350 + Math.random()*400;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1.4 + Math.random()*0.6, max: 2, c: TIERS[Math.floor(Math.random()*TIERS.length)].c, sz: 4 + Math.random()*3, kind: 'conf', rot: Math.random()*6, vr: (Math.random()-0.5)*16 });
  }
  if (particles.length > 500) particles.splice(0, particles.length - 500);
}

// Render
// =====================================================================
function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a1330'); g.addColorStop(0.5, '#120f22'); g.addColorStop(1, '#0a0a12');
  ctx.fillStyle = g; ctx.fillRect(-40, -40, W + 80, H + 80);
  for (const k of bokeh){
    const y = (k.y - time * k.s) % (H + 200); const yy = y < -100 ? y + H + 200 : y;
    const x = k.x + Math.sin(time * 0.3 + k.p) * 20;
    const rg = ctx.createRadialGradient(x, yy, 0, x, yy, k.r);
    rg.addColorStop(0, TIERS[k.h].c + '22'); rg.addColorStop(1, TIERS[k.h].c + '00');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, yy, k.r, 0, Math.PI*2); ctx.fill();
  }
}

function drawJar(danger){
  const { l, r, top, bottom } = JAR;
  ctx.save();
  rr(l - 6, top - 10, r - l + 12, bottom - top + 16, 22);
  ctx.fillStyle = 'rgba(255,255,255,0.035)'; ctx.fill();
  ctx.lineWidth = 3;
  const sg = ctx.createLinearGradient(0, top, 0, bottom);
  sg.addColorStop(0, 'rgba(255,255,255,0.05)'); sg.addColorStop(1, 'rgba(255,255,255,0.22)');
  ctx.strokeStyle = sg; ctx.stroke();
  // glass sheen
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  rr(l + 4, top + 10, 10, bottom - top - 40, 5); ctx.fill();
  // danger line
  ctx.setLineDash([10, 8]); ctx.lineWidth = 2;
  ctx.strokeStyle = danger > 0 ? `rgba(255,80,80,${0.5 + 0.5 * Math.abs(Math.sin(time * 12))})` : 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.moveTo(l, TOP_LINE); ctx.lineTo(r, TOP_LINE); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
}

function drawHUD(){
  // score
  shownScore += (score - shownScore) * 0.2; if (Math.abs(score - shownScore) < 1) shownScore = score;
  const sp = 1 + 0.25 * scorePop;
  ctx.save(); ctx.translate(26, 46); ctx.scale(sp, sp);
  ctx.fillStyle = '#fff'; ctx.font = '800 38px system-ui,-apple-system,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8;
  ctx.fillText(Math.round(shownScore).toLocaleString(), 0, 0);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '700 12px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('🏆 ' + best.toLocaleString(), 28, 76);

  // evolution strip (progress of this run)
  for (let i = 0; i < TIERS.length; i++){
    const x = 30 + i * 19, y = 100;
    if (i <= runTier || i <= bestTier) drawBall(x, y, i, { s: 8 / TIERS[i].r, alpha: i <= runTier ? 1 : 0.3, shadow: false });
    else { ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fill(); }
  }

  // next card
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; rr(312, 18, 72, 70, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '800 10px system-ui,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('NEXT', 348, 30);
  const ns = Math.min(1, 20 / TIERS[next].r) * (0.4 + 0.6 * easeOutBack(nextPop));
  drawBall(348, 60, next, { s: ns, shadow: false });

  drawGear(282, 38);
}

function drawBanner(bn){
  const p = 1 - bn.life / (bn.t >= 0 ? 2.2 : 1.8);
  const inP = clamp(p / 0.15, 0, 1), outA = clamp(bn.life / 0.3, 0, 1);
  const sc = easeOutBack(inP);
  ctx.save(); ctx.translate(W/2, 300); ctx.scale(sc, sc); ctx.globalAlpha = outA;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(-150, -50, 300, 100, 24); ctx.fill();
  ctx.strokeStyle = bn.t >= 0 ? TIERS[bn.t].c : '#ffd75a'; ctx.lineWidth = 3; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (bn.t >= 0){
    drawBall(-100, 0, bn.t, { s: 32 / TIERS[bn.t].r, a: Math.sin(time * 6) * 0.2, shadow: false });
    ctx.fillStyle = TIERS[bn.t].c; ctx.font = '900 18px system-ui,sans-serif'; ctx.fillText(bn.title, 20, -16);
    ctx.fillStyle = '#fff'; ctx.font = '800 24px system-ui,sans-serif'; ctx.fillText(bn.name, 20, 14);
  } else {
    ctx.fillStyle = '#ffd75a'; ctx.font = '900 34px system-ui,sans-serif'; ctx.fillText('🏆 ' + bn.title, 0, 2);
  }
  ctx.restore();
}

function drawTitle(){

function drawOver(){
  const p = easeOutCubic(clamp(overT / 0.5, 0, 1));
  ctx.fillStyle = `rgba(5,5,12,${0.72 * p})`; ctx.fillRect(0, 0, W, H);
  ui(0, 0, W, H, () => {});
  const oy = H/2 + (1 - p) * 80;
  ctx.save(); ctx.translate(W/2, oy); ctx.globalAlpha = p;
  ctx.fillStyle = 'rgba(30,26,50,0.95)'; rr(-150, -180, 300, 370, 28); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '800 16px system-ui,sans-serif';
  ctx.fillText(daily ? 'DAILY CHALLENGE' : 'GAME OVER', 0, -145);
  ctx.fillStyle = '#fff'; ctx.font = '900 52px system-ui,sans-serif'; ctx.fillText(score.toLocaleString(), 0, -95);
  const ref = daily ? (dailyBest[dailyKey] || 0) : best;
  const isBest = score >= ref && score > 0 && score > bestAtStart;
  ctx.fillStyle = isBest ? '#ffd75a' : 'rgba(255,255,255,0.5)'; ctx.font = '700 14px system-ui,sans-serif';
  ctx.fillText(isBest ? 'NEW BEST!' : (daily ? 'TODAY BEST ' : 'BEST ') + ref.toLocaleString(), 0, -55);
  drawBall(0, 15, runTier, { s: 40 / TIERS[runTier].r, a: Math.sin(time * 3) * 0.15 });
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '700 14px system-ui,sans-serif';
  ctx.fillText('Reached: ' + TIERS[runTier].n, 0, 72);
  ctx.restore();
  if (overT > 0.8){
    ctx.save(); ctx.globalAlpha = clamp((overT - 0.8) / 0.2, 0, 1);
    pillButton(W/2, oy + 122, 200, 50, 'PLAY AGAIN', '#ff5a52', () => { sfx.click(); startGame(daily); });
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '700 14px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('HOME', W/2, oy + 166);
    ui(W/2 - 60, oy + 150, 120, 34, () => { sfx.click(); goHome(); });
  }
}

function render(){
  uiHits = [];
  const danger = clamp(overTimer / 2, 0, 1);
  ctx.save();
  // camera: zoom punch + smooth trauma shake (shakes the view, never the simulation)
  const sh = settings.shake ? trauma * trauma : 0;
  const ox = 12 * sh * (0.6 * Math.sin(shakeT * 11) + 0.4 * Math.sin(shakeT * 23 + 1.3));
  const oy = 9 * sh * (0.6 * Math.sin(shakeT * 13 + 2) + 0.4 * Math.sin(shakeT * 19 + 0.7));
  const rot = 0.025 * sh * Math.sin(shakeT * 9 + 4);
  ctx.translate(W/2 + ox, H/2 + oy); ctx.rotate(rot); const z = settings.shake ? zoom : 1; ctx.scale(z, z); ctx.translate(-W/2, -H/2);

  drawBackground();
  drawJar(danger);

  if (mode === 'play'){
    const x = aimPos();
    const bob = Math.sin(time * 4) * 2;
    drawBall(x, DROP_Y + bob, cur, { alpha: canDrop ? 1 : 0.35, a: Math.sin(time * 2) * 0.1 });
  }

  for (const b of balls){
    const s = b.pop < 1 ? 0.5 + 0.5 * easeOutBack(b.pop) : 1;
    drawBall(b.x, b.y, b.t, { s, a: b.a, sq: b.sq, flash: b.flash });
  }
  for (const g of rings){
    ctx.globalAlpha = g.life; ctx.strokeStyle = g.c; ctx.lineWidth = g.w * g.life;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI*2); ctx.stroke();
  }
  for (const p of particles){
    ctx.globalAlpha = clamp(p.life / p.max * 2, 0, 1); ctx.fillStyle = p.c;
    if (p.kind === 'dot'){ ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * (0.4 + 0.6 * p.life / p.max), 0, Math.PI*2); ctx.fill(); }
    else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.kind === 'star'){ starPath(0, 0, p.sz * 1.3, p.sz * 0.5, 4); ctx.fill(); }
      else ctx.fillRect(-p.sz, -p.sz * 0.5, p.sz * 2, p.sz);
      ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts){
    const age = 1 - t.life, sc = (t.big ? 1.5 : 1) * (age < 0.15 ? easeOutBack(age / 0.15) : 1);
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(sc, sc); ctx.globalAlpha = clamp(t.life * 2, 0, 1);
    ctx.font = '900 22px system-ui,sans-serif'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineJoin = 'round';
    ctx.strokeText(t.s, 0, 0); ctx.fillStyle = '#fff'; ctx.fillText(t.s, 0, 0);
    if (t.sub){ ctx.font = '900 15px system-ui,sans-serif'; ctx.strokeText(t.sub, 0, 20); ctx.fillStyle = t.c; ctx.fillText(t.sub, 0, 20); }
    ctx.restore();
  }
  ctx.restore();

  // screen-space overlays
  if (danger > 0){
    const vg = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.75);
    vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(1, `rgba(255,30,30,${0.45 * danger * (0.6 + 0.4 * Math.sin(time * 12))})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (mode !== 'title') drawHUD();
  for (const bn of banners) drawBanner(bn);
  if (mode === 'title') drawTitle();
  if (mode === 'over') drawOver();
  if (showSettings) drawSettings();
  if (paused && mode === 'play' && !showSettings){
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 30px system-ui,sans-serif'; ctx.fillText('❚❚', W/2, H/2);
  }
}

// =====================================================================
// Loop
// =====================================================================
let last = performance.now(), firstFrameSent = false;
function loop(now){
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  time += dt;
  tiltG += (tiltTarget - tiltG) * Math.min(1, dt * 8);

  // hit-stop freezes the simulation only (real-time timer), visuals keep animating
  let simDt = dt;
  if (hitStop > 0){ hitStop -= dt; simDt = 0; }
  if (!paused && !showSettings && mode === 'play' && simDt > 0){
    for (let i = 0; i < SUBSTEPS; i++) step(simDt / SUBSTEPS);
    checkOver(simDt);
    comboTimer -= simDt;
  }
  if (mode === 'over') overT += dt;

  for (const b of balls){
    if (b.pop < 1) b.pop = Math.min(1, b.pop + dt / 0.3);
    b.flash = Math.max(0, b.flash - dt * 6);
    // spring squash back to rest
    b.sqv += (-b.sq * 320 - b.sqv * 14) * dt; b.sq += b.sqv * dt;
  }
  for (const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.kind === 'conf' ? 500 : 420)*dt; p.vx *= 0.99; p.rot += p.vr*dt; p.life -= dt; }
  for (const g of rings){ g.r += (g.max - g.r) * dt * 9; g.life -= dt * 2.6; }
  for (const t of texts){ t.y -= 60 * dt * t.life; t.x += t.vx * dt; t.life -= dt * 1.1; }
  for (const bn of banners) bn.life -= dt;
  particles = particles.filter(p => p.life > 0);
  rings = rings.filter(g => g.life > 0);
  texts = texts.filter(t => t.life > 0);
  banners = banners.filter(b => b.life > 0).slice(-2);
  trauma = Math.max(0, trauma - dt * 1.4); shakeT += dt * 3;
  zoomV += (-(zoom - 1) * 180 - zoomV * 12) * dt; zoom += zoomV * dt * 0.06;
  scorePop = Math.max(0, scorePop - dt * 4);
  nextPop = Math.min(1, nextPop + dt / 0.3);

  saveTimer += dt;
  if (dirty && saveTimer >= SAVE_INTERVAL) flushSave();

  render();
  if (!firstFrameSent){ firstFrameSent = true; sdk.firstFrame(); }
  requestAnimationFrame(loop);
}

// =====================================================================
// Boot
// =====================================================================
(async function boot(){
  resize();
  if (yt){
    try{
      ytAudio = yt.system.isAudioEnabled();
      yt.system.onAudioEnabledChange(on => { ytAudio = on; music.sync(); });
      yt.system.onPause(() => { paused = true; persist(true); music.sync(); });
      yt.system.onResume(() => { paused = false; last = performance.now(); music.sync(); });
    }catch(e){}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ persist(true); if (mode === 'play') showSettings = true; music.stop(); }
    else music.sync();
  });
  // Android grants orientation without a prompt; iOS asks on first tap
  requestAnimationFrame(loop);
  try{
    const s = JSON.parse(await sdk.load() || '{}');
    best = s.best || 0; bestTier = s.bestTier || 0; dailyBest = s.dailyBest || {};
    sdk._sent = best;
    if (s.settings && s.settings.v === 2) Object.assign(settings, s.settings);
    if (settings.tilt) enableTilt();
    if (s.run && s.run.balls && s.run.balls.length){
      mode = 'play'; score = shownScore = s.run.score || 0; cur = s.run.cur || 0; next = s.run.next || 0; runTier = s.run.runTier || 0;
      daily = !!s.run.daily; dailyKey = s.run.dailyKey || 0; seedState = s.run.seedState || 0; rng = daily ? seeded : Math.random;
      bestAtStart = daily ? (dailyBest[dailyKey] || 0) : best; newBestShown = true;
      showSettings = true;                                   // resume into the pause menu, not mid-action
      balls = s.run.balls.map(([x, y, t]) => { const b = makeBall(x, y, t); b.born = 0; b.landed = true; return b; });
    }
  }catch(e){}
  sdk.ready();
})();
</script>
